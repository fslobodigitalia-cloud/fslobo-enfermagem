<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <title>Sem conexão — FSlobo Enfermagem</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(160deg, #EFF6FF 0%, #DBEAFE 100%);
        color: #0F172A;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center;
      }
      .card {
        max-width: 380px; background: #fff; border-radius: 24px;
        padding: 32px 24px; box-shadow: 0 20px 60px -20px rgba(37, 99, 235, .3);
      }
      .badge {
        width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 16px;
        background: linear-gradient(135deg, #3B82F6, #2563EB);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: 28px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #64748B; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #2563EB; color: #fff; font-weight: 600;
        padding: 12px 24px; border-radius: 12px; font-size: 15px;
      }
      button:active { transform: scale(.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">📶</div>
      <h1>Você está offline</h1>
      <p>Não conseguimos carregar essa página. Verifique sua conexão e tente de novo — o conteúdo já visitado continua disponível.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </div>
  </body>
</html>
