<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07040D" />

    <title>Entre Nós Tarô | Leituras de Tarô Online</title>
    <meta
      name="description"
      content="Leituras de tarô online, individuais e confidenciais para amor, decisões, vida profissional e autoconhecimento. Escolha suas perguntas e consulte pelo WhatsApp."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Entre Nós Tarô" />

    <!-- ⚠️ Ajuste o domínio em src/config/site.ts (contact.siteUrl) e nas linhas abaixo. -->
    <link rel="canonical" href="https://www.entrenostaro.com.br/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Entre Nós Tarô" />
    <meta property="og:title" content="Entre Nós Tarô | Leituras de Tarô Online" />
    <meta
      property="og:description"
      content="Leituras de tarô online, individuais e confidenciais para amor, decisões, vida profissional e autoconhecimento."
    />
    <meta property="og:url" content="https://www.entrenostaro.com.br/" />
    <meta property="og:image" content="https://www.entrenostaro.com.br/brand/og-entre-nos-taro.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cartas de tarô douradas diante de um eclipse roxo — Entre Nós Tarô"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Entre Nós Tarô | Leituras de Tarô Online" />
    <meta
      name="twitter:description"
      content="Leituras de tarô online, individuais e confidenciais. Escolha suas perguntas e consulte pelo WhatsApp."
    />
    <meta name="twitter:image" content="https://www.entrenostaro.com.br/brand/og-entre-nos-taro.jpg" />

    <!-- Ícones -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- O logotipo aparece imediatamente no cabeçalho. -->
    <link rel="preload" as="image" href="/brand/logo-256.webp" type="image/webp" />

    <!-- Tipografia: apenas os pesos realmente utilizados -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <style>
      /* Cor de fundo aplicada antes do CSS principal: evita flash claro. */
      html,
      body,
      #root {
        background-color: #07040d;
        margin: 0;
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; color: #f7f0e5; font-family: system-ui, sans-serif">
        <h1>Entre Nós Tarô</h1>
        <p>
          Leituras de tarô online, individuais e confidenciais para amor, decisões, vida
          profissional e autoconhecimento. Ative o JavaScript para visualizar o site completo.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
