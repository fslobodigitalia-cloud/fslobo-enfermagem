<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />

    <title>Guia de Evolução de Enfermagem | FSlobo Enfermagem</title>
    <meta
      name="description"
      content="Mais de 132 modelos prontos de evolução e anotação de enfermagem para consulta prática no plantão e nos estudos. Material digital em PDF."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="FSlobo Enfermagem" />

    <!-- ⚠️ Ajuste o domínio em src/config/site.ts (contact.siteUrl) e nas linhas abaixo. -->
    <link rel="canonical" href="https://www.fsloboenfermagem.com.br/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="FSlobo Enfermagem" />
    <meta property="og:title" content="Guia de Evolução de Enfermagem | FSlobo Enfermagem" />
    <meta
      property="og:description"
      content="Mais de 132 modelos prontos de evolução e anotação de enfermagem para consulta prática no plantão e nos estudos. Material digital em PDF."
    />
    <meta property="og:url" content="https://www.fsloboenfermagem.com.br/" />
    <meta property="og:image" content="https://www.fsloboenfermagem.com.br/guia-evolucao/og-guia-evolucao.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Guia de Evolução de Enfermagem — mais de 132 modelos prontos"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Guia de Evolução de Enfermagem | FSlobo Enfermagem" />
    <meta
      name="twitter:description"
      content="Mais de 132 modelos prontos de evolução e anotação de enfermagem para consulta prática no plantão e nos estudos."
    />
    <meta name="twitter:image" content="https://www.fsloboenfermagem.com.br/guia-evolucao/og-guia-evolucao.jpg" />

    <!-- Ícones — identidade FSlobo Enfermagem (teal + coração/pulso).
         favicon.svg é o principal (nítido em qualquer tamanho); os PNGs
         abaixo são fallback para navegadores sem suporte a favicon SVG. -->
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Tipografia: apenas o peso realmente utilizado -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <style>
      /* Cor de fundo aplicada antes do CSS principal: garante a primeira
         pintura já na cor final, sem depender do carregamento do CSS. */
      html,
      body,
      #root {
        background-color: #ffffff;
        margin: 0;
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; color: #0f172a; font-family: system-ui, sans-serif">
        <h1>Guia de Evolução de Enfermagem</h1>
        <p>
          Mais de 132 modelos prontos de evolução e anotação de enfermagem para consulta prática
          no plantão e nos estudos. Ative o JavaScript para visualizar o site completo.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
